# TEMPORARY discovery workflow (round 2).
#
# Round 1 proved `dotnet package search --exact-match --format json` does not carry a usable
# latestVersion field. This round resolves versions the way it actually matters: put the packages
# into a scratch project, restore, and read back what NuGet chose. That is ground truth for the
# pins in eng/versions.props, including the "latest 11.3.x Avalonia" constraint we deliberately
# hold back from the 12.x major.
#
# Delete this file once eng/versions.props is pinned.
name: probe-packages

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve versions through a real restore
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/probe
          REPORT="$GITHUB_WORKSPACE/ci-artifacts/probe-results.txt"
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          {
            echo "# Generated by probe-packages round 2 on $(date -u +%FT%TZ)"
            echo
            echo "dotnet SDK in use:"
            dotnet --version
            echo
          } > "$REPORT"

          cat > /tmp/report.py <<'PY'
          import json, subprocess, sys, os
          label, proj, report = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = [f"### {label}"]
          out = subprocess.run(
              ["dotnet", "list", proj, "package", "--format", "json"],
              capture_output=True, text=True, cwd=os.path.dirname(proj),
          )
          try:
              data = json.loads(out.stdout)
          except Exception:
              lines.append("  raw stdout: " + out.stdout[:1500])
              lines.append("  raw stderr: " + out.stderr[:1500])
              open(report, "a").write("\n".join(lines) + "\n\n")
              sys.exit(0)
          rows = []
          for project in data.get("projects", []):
              for framework in project.get("frameworks", []):
                  for p in framework.get("topLevelPackages", []):
                      rows.append((p.get("id"), p.get("requestedVersion"), p.get("resolvedVersion")))
          rows.sort(key=lambda r: (r[0] or "").lower())
          for pid, requested, resolved in rows:
              lines.append(f"  {pid:<42} requested={requested:<12} resolved={resolved}")
          open(report, "a").write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
          PY

          # ---- Group A: the stack Chess Atlas actually ships -----------------
          dotnet new classlib -n ProbeA -o /tmp/probe/a -f net10.0 >/dev/null
          cd /tmp/probe/a
          add() { dotnet add package "$1" --version "$2" >/dev/null 2>&1 || echo "FAILED to add $1"; }
          add Microsoft.EntityFrameworkCore.Sqlite   '*'
          add Microsoft.EntityFrameworkCore.Design    '*'
          add Microsoft.EntityFrameworkCore.Relational '*'
          add Microsoft.Data.Sqlite                   '*'
          add Microsoft.Extensions.Hosting            '*'
          add Microsoft.Extensions.Http               '*'
          add Microsoft.Extensions.Logging            '*'
          add Microsoft.Extensions.Configuration.Json '*'
          add CommunityToolkit.Mvvm                   '*'
          add Serilog                                 '*'
          add Serilog.Sinks.File                      '*'
          add Serilog.Sinks.Console                   '*'
          add Serilog.Extensions.Hosting              '*'
          add Serilog.Settings.Configuration          '*'
          add xunit                                   '*'
          add xunit.runner.visualstudio               '*'
          add Microsoft.NET.Test.Sdk                  '*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group A - shipped stack" ProbeA.csproj "$REPORT"

          # ---- Group B: Avalonia, held on the 11.3 line ----------------------
          dotnet new classlib -n ProbeB -o /tmp/probe/b -f net10.0 >/dev/null
          cd /tmp/probe/b
          add Avalonia                    '11.3.*'
          add Avalonia.Desktop            '11.3.*'
          add Avalonia.Themes.Fluent      '11.3.*'
          add Avalonia.Themes.Simple      '11.3.*'
          add Avalonia.Fonts.Inter        '11.3.*'
          add Avalonia.Diagnostics        '11.3.*'
          add Avalonia.Headless           '11.3.*'
          add Avalonia.Headless.XUnit     '11.3.*'
          add Avalonia.Controls.DataGrid  '11.3.*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group B - Avalonia 11.3 line" ProbeB.csproj "$REPORT"

          # ---- Group C: Avalonia 12 major, for the upgrade ADR ---------------
          dotnet new classlib -n ProbeC -o /tmp/probe/c -f net10.0 >/dev/null
          cd /tmp/probe/c
          add Avalonia                '*'
          add Avalonia.Desktop        '*'
          add Avalonia.Themes.Fluent  '*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group C - Avalonia latest major" ProbeC.csproj "$REPORT"

          # ---- Group D: xunit v3, to decide v2 vs v3 -------------------------
          dotnet new classlib -n ProbeD -o /tmp/probe/d -f net10.0 >/dev/null
          cd /tmp/probe/d
          add xunit.v3                  '*'
          add xunit.runner.visualstudio '*'
          add Microsoft.NET.Test.Sdk    '*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group D - xunit v3" ProbeD.csproj "$REPORT"

          # ---- Group E: chess libraries that might exist ---------------------
          dotnet new classlib -n ProbeE -o /tmp/probe/e -f net10.0 >/dev/null
          cd /tmp/probe/e
          add ChessDotNet '*'
          add Chessie     '*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group E - third-party chess libs" ProbeE.csproj "$REPORT"

          # ---- Group F: compression / misc for the importer ------------------
          dotnet new classlib -n ProbeF -o /tmp/probe/f -f net10.0 >/dev/null
          cd /tmp/probe/f
          add SharpCompress '*'
          add System.IO.Hashing '*'
          dotnet restore >/dev/null 2>&1 || dotnet restore
          python3 /tmp/report.py "Group F - importer helpers" ProbeF.csproj "$REPORT"

      - name: Save report
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat ci-artifacts/probe-results.txt
          git config user.name  "chessatlas-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-artifacts/probe-results.txt
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "ci: round 2 probe marker [skip ci]"
            git push origin HEAD:"${GITHUB_REF#refs/heads/}"
          fi
