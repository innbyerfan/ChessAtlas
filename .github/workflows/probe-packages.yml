# TEMPORARY discovery workflow (round 3).
#
# Rounds 1 and 2 taught us: (a) `dotnet package search --exact-match --format json` carries no
# usable latestVersion, and (b) Microsoft.NET.Test.Sdk refuses to restore into a classlib, which
# killed the round-2 job before it wrote anything. This round uses console projects, captures every
# command's output into the report, and always exits 0 so the report step runs.
#
# Delete this file once eng/versions.props is pinned.
name: probe-packages

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve versions through a real restore
        shell: bash
        run: |
          REPORT="$GITHUB_WORKSPACE/ci-artifacts/probe-results.txt"
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts" /tmp/probe

          {
            echo "# probe-packages round 3 - $(date -u +%FT%TZ)"
            echo
            echo "dotnet --version: $(dotnet --version)"
            echo
          } > "$REPORT"

          cat > /tmp/report.py <<'PY'
          import json, subprocess, sys, os
          label, proj, report = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = [f"### {label}"]
          out = subprocess.run(
              ["dotnet", "list", proj, "package", "--format", "json"],
              capture_output=True, text=True, cwd=os.path.dirname(proj),
          )
          try:
              data = json.loads(out.stdout)
          except Exception:
              lines.append("  (could not parse) stdout: " + out.stdout[:1200])
              lines.append("  (could not parse) stderr: " + out.stderr[:1200])
              open(report, "a").write("\n".join(lines) + "\n\n")
              print("\n".join(lines))
              sys.exit(0)
          rows = []
          for project in data.get("projects", []):
              for framework in project.get("frameworks", []):
                  for p in framework.get("topLevelPackages", []):
                      rows.append((p.get("id"), p.get("requestedVersion"), p.get("resolvedVersion")))
          rows.sort(key=lambda r: (r[0] or "").lower())
          if not rows:
              lines.append("  (no top-level packages resolved)")
          for pid, requested, resolved in rows:
              lines.append(f"  {pid:<42} requested={str(requested):<12} resolved={resolved}")
          open(report, "a").write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
          PY

          # newproj <dir> <name>
          newproj() {
            local dir="$1" name="$2"
            rm -rf "$dir"
            {
              echo "--- new $name ---"
              dotnet new console -n "$name" -o "$dir" -f net10.0 2>&1 | tail -3
            } >> "$REPORT"
          }

          # add <dir> <id> <version-constraint>
          add() {
            local dir="$1" id="$2" ver="$3"
            {
              echo "--- add $id $ver ---"
              (cd "$dir" && dotnet add package "$id" --version "$ver" 2>&1 | tail -4)
            } >> "$REPORT"
          }

          # restore <dir>
          dorst() {
            {
              echo "--- restore $1 ---"
              (cd "$1" && dotnet restore 2>&1 | tail -12)
            } >> "$REPORT"
          }

          # ---- Group A: EF Core / Extensions / MVVM / Serilog / xunit v2 -----
          newproj /tmp/probe/a ProbeA
          add /tmp/probe/a Microsoft.EntityFrameworkCore.Sqlite    '*'
          add /tmp/probe/a Microsoft.EntityFrameworkCore.Design     '*'
          add /tmp/probe/a Microsoft.EntityFrameworkCore.Relational '*'
          add /tmp/probe/a Microsoft.Data.Sqlite                    '*'
          add /tmp/probe/a Microsoft.Extensions.Hosting             '*'
          add /tmp/probe/a Microsoft.Extensions.Http                '*'
          add /tmp/probe/a Microsoft.Extensions.Logging             '*'
          add /tmp/probe/a Microsoft.Extensions.Configuration.Json  '*'
          add /tmp/probe/a CommunityToolkit.Mvvm                    '*'
          add /tmp/probe/a Serilog                                  '*'
          add /tmp/probe/a Serilog.Sinks.File                       '*'
          add /tmp/probe/a Serilog.Sinks.Console                    '*'
          add /tmp/probe/a Serilog.Extensions.Hosting               '*'
          add /tmp/probe/a Serilog.Settings.Configuration           '*'
          add /tmp/probe/a xunit                                    '*'
          add /tmp/probe/a xunit.runner.visualstudio                '*'
          add /tmp/probe/a Microsoft.NET.Test.Sdk                   '*'
          dorst /tmp/probe/a
          python3 /tmp/report.py "Group A - shipped stack" /tmp/probe/a/ProbeA.csproj "$REPORT"

          # ---- Group B: Avalonia held on the 11.3 line -----------------------
          newproj /tmp/probe/b ProbeB
          add /tmp/probe/b Avalonia                   '11.3.*'
          add /tmp/probe/b Avalonia.Desktop           '11.3.*'
          add /tmp/probe/b Avalonia.Themes.Fluent     '11.3.*'
          add /tmp/probe/b Avalonia.Themes.Simple     '11.3.*'
          add /tmp/probe/b Avalonia.Fonts.Inter       '11.3.*'
          add /tmp/probe/b Avalonia.Diagnostics       '11.3.*'
          add /tmp/probe/b Avalonia.Headless          '11.3.*'
          add /tmp/probe/b Avalonia.Headless.XUnit    '11.3.*'
          add /tmp/probe/b Avalonia.Controls.DataGrid '11.3.*'
          dorst /tmp/probe/b
          python3 /tmp/report.py "Group B - Avalonia 11.3 line" /tmp/probe/b/ProbeB.csproj "$REPORT"

          # ---- Group C: Avalonia latest major, for the upgrade ADR -----------
          newproj /tmp/probe/c ProbeC
          add /tmp/probe/c Avalonia               '*'
          add /tmp/probe/c Avalonia.Desktop       '*'
          add /tmp/probe/c Avalonia.Themes.Fluent '*'
          dorst /tmp/probe/c
          python3 /tmp/report.py "Group C - Avalonia latest major" /tmp/probe/c/ProbeC.csproj "$REPORT"

          # ---- Group D: xunit v3, to choose v2 vs v3 -------------------------
          newproj /tmp/probe/d ProbeD
          add /tmp/probe/d xunit.v3                  '*'
          add /tmp/probe/d xunit.runner.visualstudio '*'
          add /tmp/probe/d Microsoft.NET.Test.Sdk    '*'
          dorst /tmp/probe/d
          python3 /tmp/report.py "Group D - xunit v3" /tmp/probe/d/ProbeD.csproj "$REPORT"

          # ---- Group E: third-party chess libraries --------------------------
          newproj /tmp/probe/e ProbeE
          add /tmp/probe/e ChessDotNet '*'
          add /tmp/probe/e Chessie     '*'
          dorst /tmp/probe/e
          python3 /tmp/report.py "Group E - third-party chess libs" /tmp/probe/e/ProbeE.csproj "$REPORT"

          # ---- Group F: importer helpers ------------------------------------
          newproj /tmp/probe/f ProbeF
          add /tmp/probe/f SharpCompress   '*'
          add /tmp/probe/f System.IO.Hashing '*'
          dorst /tmp/probe/f
          python3 /tmp/report.py "Group F - importer helpers" /tmp/probe/f/ProbeF.csproj "$REPORT"

          echo
          echo "=== full report ==="
          cat "$REPORT"
          exit 0

      - name: Push report back into the branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "chessatlas-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-artifacts/probe-results.txt
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "ci: publish round 3 NuGet probe results [skip ci]"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
