# TEMPORARY discovery workflow.
#
# Why this exists
# ---------------
# The development sandbox has no .NET SDK and no egress to nuget.org, and it cannot read
# Actions logs (results-receiver.actions.githubusercontent.com is blocked). So this job
# resolves package versions on a runner that *does* have NuGet access and pushes the
# result back into the branch as a file, where the sandbox can `git pull` it.
#
# The commit message carries [skip ci] so the report commit does not re-trigger CI.
#
# Delete this file once eng/versions.props is pinned against real numbers.
name: probe-packages

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve candidate package versions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts
          REPORT=ci-artifacts/probe-results.txt

          {
            echo "# Generated by .github/workflows/probe-packages.yml on $(date -u +%FT%TZ)"
            echo
            echo "## SDK"
            dotnet --list-sdks
            echo
            echo "## Exact-match package versions"
          } > "$REPORT"

          cat > /tmp/readver.py <<'PY'
          import json, sys
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except Exception:
              print("UNRESOLVED")
              sys.exit(0)
          groups = data.get("searchResult") or []
          if not groups:
              print("NOT-FOUND")
              sys.exit(0)
          pkgs = groups[0].get("packages") or []
          if not pkgs:
              print("NOT-FOUND")
              sys.exit(0)
          print(pkgs[0].get("latestVersion") or "?")
          PY

          ids=(
            Microsoft.EntityFrameworkCore.Sqlite
            Microsoft.EntityFrameworkCore.Design
            Microsoft.EntityFrameworkCore.Relational
            Microsoft.Data.Sqlite
            Microsoft.Extensions.Hosting
            Microsoft.Extensions.DependencyInjection
            Microsoft.Extensions.Logging
            Microsoft.Extensions.Http
            Microsoft.Extensions.Configuration.Json
            CommunityToolkit.Mvvm
            Serilog
            Serilog.Sinks.File
            Serilog.Sinks.Console
            Serilog.Sinks.Debug
            Serilog.Extensions.Hosting
            Serilog.Settings.Configuration
            Avalonia
            Avalonia.Desktop
            Avalonia.Themes.Fluent
            Avalonia.Themes.Simple
            Avalonia.Fonts.Inter
            Avalonia.Diagnostics
            Avalonia.Headless
            Avalonia.Headless.XUnit
            Avalonia.Svg
            Avalonia.Controls.DataGrid
            CommunityToolkit.Avalonia
            xunit
            xunit.v3
            xunit.runner.visualstudio
            xunit.assert
            Microsoft.NET.Test.Sdk
            Chessnut
            ChessDotNet
            ChessLib
          )
          for id in "${ids[@]}"; do
            ver=$(dotnet package search "$id" --exact-match --format json --take 1 2>/dev/null | python3 /tmp/readver.py)
            printf '%-45s %s\n' "$id" "${ver:-ERROR}" >> "$REPORT"
          done

          cat > /tmp/survey.py <<'PY'
          import json, sys
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except Exception:
              sys.exit(0)
          rows = []
          for group in (data.get("searchResult") or []):
              for p in (group.get("packages") or []):
                  rows.append((p.get("id") or "?", str(p.get("latestVersion")), int(p.get("totalDownloads") or 0)))
          rows.sort(key=lambda r: -r[2])
          for rid, ver, dl in rows:
              print(f"{rid:<45} {ver:<16} dl={dl}")
          PY

          {
            echo
            echo "## Landscape survey (top 25 by downloads per search term)"
          } >> "$REPORT"

          for term in chess uci-engine pgn fen chessboard stockfish; do
            echo "=== $term ===" >> "$REPORT"
            dotnet package search "$term" --format json --take 25 2>/dev/null | python3 /tmp/survey.py >> "$REPORT"
            echo >> "$REPORT"
          done

          echo "--- REPORT ---"
          cat "$REPORT"

      - name: Push report back into the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "chessatlas-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-artifacts/probe-results.txt
          if git diff --cached --quiet; then
            echo "No change to report."
          else
            git commit -m "ci: publish NuGet package probe results [skip ci]"
            git push origin HEAD:"${GITHUB_REF#refs/heads/}"
          fi
