# TEMPORARY discovery workflow.
#
# Purpose: the development sandbox has no NuGet access, so package versions must be
# resolved from a machine that does. This job prints the latest stable version of every
# candidate package straight from nuget.org so Directory.Packages.props can pin real
# numbers instead of guesses.
#
# Delete this file once the version pins in eng/versions.props are confirmed.
name: probe-packages

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Report SDKs
        run: |
          dotnet --info | head -30
          echo "---"
          dotnet --list-sdks

      - name: Resolve candidate package versions
        shell: bash
        run: |
          set -uo pipefail
          ids=(
            Microsoft.EntityFrameworkCore.Sqlite
            Microsoft.EntityFrameworkCore.Design
            Microsoft.EntityFrameworkCore.Relational
            Microsoft.Data.Sqlite
            Microsoft.Extensions.Hosting
            Microsoft.Extensions.DependencyInjection
            Microsoft.Extensions.Logging
            Microsoft.Extensions.Http
            Microsoft.Extensions.Configuration.Json
            CommunityToolkit.Mvvm
            Serilog
            Serilog.Sinks.File
            Serilog.Sinks.Console
            Serilog.Sinks.Debug
            Serilog.Extensions.Hosting
            Serilog.Settings.Configuration
            Avalonia
            Avalonia.Desktop
            Avalonia.Themes.Fluent
            Avalonia.Themes.Simple
            Avalonia.Fonts.Inter
            Avalonia.Diagnostics
            Avalonia.Headless
            Avalonia.Headless.XUnit
            Avalonia.AvaloniaEdit
            Avalonia.Svg
            Avalonia.Controls.DataGrid
            CommunityToolkit.Avalonia
            xunit
            xunit.v3
            xunit.runner.visualstudio
            xunit.assert
            Microsoft.NET.Test.Sdk
            Microsoft.Playwright
            Chessnut
            ChessDotNet
            ChessLib
            SharpChess
            StockfishSharp
            Lichess.NET
          )
          for id in "${ids[@]}"; do
            out=$(dotnet package search "$id" --exact-match --format json --take 1 2>&1)
            ver=$(printf '%s' "$out" | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception:
              print("UNRESOLVED")
              raise SystemExit
          hits = (data.get("searchResult") or [])
          if not hits:
              print("NOT-FOUND")
              raise SystemExit
          pkgs = hits[0].get("packages") or []
          if not pkgs:
              print("NOT-FOUND")
              raise SystemExit
          p = pkgs[0]
          print(p.get("latestVersion") or "?")
          ' 2>/dev/null)
            printf '%-45s %s\n' "$id" "$ver"
          done

      - name: Survey the chess-library landscape
        shell: bash
        run: |
          for term in chess fen pgn uci; do
            echo "=========== $term ==========="
            dotnet package search "$term" --format json --take 20 2>/dev/null \
              | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception:
              raise SystemExit
          for group in (data.get("searchResult") or []):
              for p in (group.get("packages") or []):
                  print(f"{p.get(\"id\"):<45} {str(p.get(\"latestVersion\")):<14} dl={p.get(\"totalDownloads\")}")
          '
          done
