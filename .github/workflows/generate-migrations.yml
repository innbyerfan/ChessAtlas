# Regenerates the EF Core migration set from the current model and commits it.
#
# Why a workflow instead of a local command: `dotnet ef migrations add` has to run against the exact
# EF Core version the project pins, and the development sandbox has no .NET SDK. Running it here
# means the checked-in migration and ModelSnapshot are always produced by the same toolchain CI
# builds with, so the snapshot can never drift from what the tests apply.
#
# Trigger it by putting [gen-migrations] in a commit message:
#   git commit --allow-empty -m "chore: refresh migrations [gen-migrations]"
#
# The full transcript lands in ci-artifacts/migrations-log.txt and is pushed back even when the
# generation fails, so a failure here is diagnosable without the Actions log viewer.
name: generate-migrations

on:
  push:
    branches:
      - "arena/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[gen-migrations]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare
        run: |
          mkdir -p ci-artifacts
          : > ci-artifacts/migrations-log.txt
          {
            echo "run: $GITHUB_RUN_ID  sha: $GITHUB_SHA"
            dotnet --info
          } 2>&1 | tee -a ci-artifacts/migrations-log.txt

      - name: Install dotnet-ef
        run: |
          set -euo pipefail
          {
            dotnet tool install --global dotnet-ef --version 10.0.12
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet ef --version
          } 2>&1 | tee -a ci-artifacts/migrations-log.txt

      - name: Build the startup project
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet build src/ChessAtlas.Infrastructure -c Release 2>&1 | tee -a ci-artifacts/migrations-log.txt

      - name: Regenerate the initial migration
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          OUT=src/ChessAtlas.Infrastructure/Persistence/Migrations
          rm -rf "$OUT"
          dotnet ef migrations add InitialSchema \
            --project src/ChessAtlas.Infrastructure \
            --startup-project src/ChessAtlas.Infrastructure \
            --context ChessAtlasDbContext \
            --output-dir Persistence/Migrations \
            --verbose 2>&1 | tee -a ci-artifacts/migrations-log.txt
          echo "--- generated files ---" | tee -a ci-artifacts/migrations-log.txt
          ls -la "$OUT" 2>&1 | tee -a ci-artifacts/migrations-log.txt

      - name: Verify the migration applies to a clean database
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/ChessAtlas.Infrastructure \
            --startup-project src/ChessAtlas.Infrastructure \
            --context ChessAtlasDbContext \
            --connection "Data Source=/tmp/chessatlas-migration-check.db" \
            --verbose 2>&1 | tee -a ci-artifacts/migrations-log.txt
          echo "Migration applied cleanly to a fresh SQLite database." | tee -a ci-artifacts/migrations-log.txt
          rm -f /tmp/chessatlas-migration-check.db* chessatlas-designtime.db

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "chessatlas-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ChessAtlas.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "Migrations unchanged." | tee -a ci-artifacts/migrations-log.txt
            exit 0
          fi
          git commit -m "infra: regenerate EF Core initial migration [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}" || git rebase --abort
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"

      - name: Publish the transcript back into the branch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci-artifacts
          git config user.name  "chessatlas-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-artifacts/migrations-log.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: publish the migration transcript [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}" || git rebase --abort
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
